elasticsearchHosts: "https://elasticsearch-master:9200"
elasticsearchCertificateSecret: elasticsearch-master-certs
elasticsearchCertificateAuthorities: /usr/share/kibana/config/certs/ca.crt
elasticsearchCredentialSecret: elasticsearch-master-credentials
replicas: 1
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
service:
  type: ClusterIP
protocol: https
serverHost: "0.0.0.0"
