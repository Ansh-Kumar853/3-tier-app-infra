namespace: platform
backend:
  image: REPLACE_BACKEND_IMAGE
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
frontend:
  image: REPLACE_FRONTEND_IMAGE
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }
ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  certificateArn: ""
  host: ""
