name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && PYTHONPATH=. pytest -q
      - name: Verify versioned database migration
        run: cd backend && DATABASE_URL=sqlite:////tmp/platform-migration-ci.db APP_ENV=development alembic upgrade head && DATABASE_URL=sqlite:////tmp/platform-migration-ci.db APP_ENV=development alembic current
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm install --no-fund
      - run: cd frontend && npm audit --audit-level=high
      - run: cd frontend && npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t platform-backend:ci ./backend
      - run: docker build --pull -t platform-frontend:ci ./frontend
      - name: Scan backend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: platform-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan frontend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: platform-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell script syntax
        run: bash -n deploy/cluster/install-addons.sh deploy/cluster/create-db-secret.sh deploy/observability/install.sh
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.1
      - run: helm lint deploy/helm/platform
      - run: helm template platform deploy/helm/platform --set backend.image=example/backend:ci --set frontend.image=example/frontend:ci > /tmp/rendered.yaml
      - run: helm template platform deploy/helm/platform --set backend.image=example/backend:ci --set frontend.image=example/frontend:ci --set ingress.enabled=true --set ingress.host=app.example.com --set ingress.certificateArn=arn:aws:acm:ap-south-1:123456789012:certificate/00000000-0000-0000-0000-000000000000 > /tmp/rendered-tls.yaml
      - name: Verify migration Job is rendered
        run: grep -q "name: platform-db-migrate" /tmp/rendered-tls.yaml
      - name: Reject ingress without a hostname and TLS certificate
        run: if helm template platform deploy/helm/platform --set backend.image=example/backend:ci --set frontend.image=example/frontend:ci --set ingress.enabled=true >/tmp/invalid-ingress.yaml 2>/dev/null; then echo "Ingress unexpectedly rendered without TLS settings" >&2; exit 1; fi
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform -chdir=infra fmt -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
